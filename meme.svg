<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <title>GTA 6 download stuck at 99 percent, make.fun ghost to the rescue</title>
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E5A6E"/>
      <stop offset="1" stop-color="#0A3D4E"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8FE04A"/>
      <stop offset="1" stop-color="#C6F24B"/>
    </linearGradient>
  </defs>
  <!-- deep teal installer window, lime progress, cream type, yellow accents -->
  <rect width="1024" height="1024" fill="#0A3D4E"/>
  <circle cx="880" cy="120" r="180" fill="#0E5A6E" opacity="0.55"/>
  <circle cx="110" cy="920" r="210" fill="#0E5A6E" opacity="0.45"/>
  <rect x="36" y="36" width="952" height="952" rx="36" fill="url(#sea)" stroke="#FFF7E6" stroke-width="5"/>
  <!-- window title bar -->
  <circle cx="92" cy="88" r="13" fill="#FFC53D"/>
  <circle cx="132" cy="88" r="13" fill="#35D0C5"/>
  <circle cx="172" cy="88" r="13" fill="#FF7A9E"/>
  <text x="512" y="102" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="bold" fill="#FFF7E6" letter-spacing="3">GTA_VI_SETUP.EXE</text>
  <rect x="76" y="132" width="872" height="4" fill="#FFF7E6" opacity="0.25"/>
  <!-- top pill -->
  <rect x="182" y="164" width="660" height="72" rx="36" fill="#FFC53D"/>
  <text x="512" y="215" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="44" font-weight="900" fill="#0A3D4E" letter-spacing="2">GRAND THEFT AUTO VI</text>
  <!-- the joke: the size, then the stall -->
  <text x="512" y="380" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="196" font-weight="900" fill="#FFF7E6" letter-spacing="2">400 GB</text>
  <text x="512" y="478" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="88" font-weight="900" fill="#C6F24B" letter-spacing="1">STUCK AT 99%</text>
  <!-- progress bar, one percent short forever -->
  <rect x="76" y="516" width="872" height="64" rx="32" fill="#07303D" stroke="#FFF7E6" stroke-width="4"/>
  <rect x="84" y="524" width="848" height="48" rx="24" fill="url(#bar)"/>
  <text x="880" y="560" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="900" fill="#0A3D4E">99%</text>
  <text x="76" y="632" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="bold" fill="#FFF7E6">396 GB of 400 GB</text>
  <text x="948" y="632" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="bold" fill="#FFC53D">3 DAYS LEFT</text>
  <!-- the make.fun ghost, download manager, sitting on the bar's tail -->
  <g>
    <svg x="648" y="638" width="252" height="252" viewBox="0 0 32 32">
      <circle cx="16" cy="16" r="15.1" fill="#c41c83" stroke="#191419" stroke-width="1.8"/>
      <g transform="translate(3.858 3.202) scale(0.79)">
        <path d="M6.2 13a8.2 8.2 0 0 1 16.4 0v4.6c1 .2 1.8.8 2 2-.2 1.2-1 1.9-2 2.2V25a2.6 2.6 0 0 1-2.6 2.6c-2 0-4.6 0-5.7-.7-1.1.7-3.7.7-5.5.7A2.6 2.6 0 0 1 6.2 25v-.7c-1.2.3-3.5.1-3.6-1.9-.1-2.1 1.3-4.8 3.6-6.2z" fill="#191419" stroke="#191419" stroke-width="3.4" stroke-linejoin="round"/>
        <path d="M6.2 13a8.2 8.2 0 0 1 16.4 0v4.6c1 .2 1.8.8 2 2-.2 1.2-1 1.9-2 2.2V25a2.6 2.6 0 0 1-2.6 2.6c-2 0-4.6 0-5.7-.7-1.1.7-3.7.7-5.5.7A2.6 2.6 0 0 1 6.2 25v-.7c-1.2.3-3.5.1-3.6-1.9-.1-2.1 1.3-4.8 3.6-6.2z" fill="#ffffff"/>
        <path d="M6.3 24.1v-2.5m8 5.8v-1.5" fill="none" stroke="#191419" stroke-width="1.25" stroke-linecap="round"/>
        <path d="M13.2 10.6Q13.632 11.968 15 12.4Q13.632 12.832 13.2 14.2Q12.768 12.832 11.4 12.4Q12.768 11.968 13.2 10.6z" fill="#191419"/>
        <path d="M19.3 9.8Q19.732 11.168 21.1 11.6Q19.732 12.032 19.3 13.4Q18.868 12.032 17.5 11.6Q18.868 11.168 19.3 9.8z" fill="#191419"/>
        <circle cx="26.5" cy="13.4" r="5.5" fill="#191419"/>
        <circle cx="26.5" cy="13.4" r="3.8" fill="#c41c83"/>
        <path d="M26.926 11.395L27.154 12.811L28.539 13.186L27.262 13.84L27.334 15.273L26.317 14.261L24.977 14.772L25.625 13.492L24.725 12.375L26.142 12.596z" fill="#ffffff" stroke="#ffffff" stroke-width="0.5" stroke-linejoin="round"/>
        <circle cx="24.9" cy="19.6" r="4" fill="#191419"/>
        <circle cx="24.9" cy="19.6" r="2.3" fill="#ffffff"/>
      </g>
    </svg>
  </g>
  <!-- ghost's speech bubble -->
  <rect x="76" y="700" width="520" height="150" rx="28" fill="#FFF7E6"/>
  <path d="M596 760 L648 730 L648 800 Z" fill="#FFF7E6"/>
  <text x="336" y="762" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#0A3D4E">I'LL HANDLE IT.</text>
  <text x="336" y="822" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="bold" fill="#0A3D4E">I'M THE DOWNLOAD NOW.</text>
  <!-- the sell, in the meme's own voice -->
  <text x="512" y="922" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="900" fill="#FFC53D">MY AGENT TURNED THIS MEME</text>
  <text x="512" y="972" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="50" font-weight="900" fill="#FFF7E6">INTO REAL MONEY ON make.fun</text>
</svg>
